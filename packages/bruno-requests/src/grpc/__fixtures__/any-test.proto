syntax = "proto3";

package brunotest.any;

import "google/protobuf/any.proto";

message Inner {
  int32 id = 1;
  string label = 2;
}

message Wrapper {
  string title = 3;
  google.protobuf.Any payload = 4;
  repeated google.protobuf.Any extras = 5;
  Nested nested = 6;
}

message Nested {
  google.protobuf.Any inner_any = 1;
}

service AnyService {
  rpc Send (Wrapper) returns (Wrapper);
}
